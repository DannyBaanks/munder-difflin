<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Federación Munder: ChatGPT → oficina Linux → Munder Link → oficina Windows</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#16181d"/>

  <!-- ChatGPT -->
  <rect x="40" y="40" width="200" height="72" rx="10" fill="#1f2229" stroke="#3a3f4b"/>
  <text x="140" y="70" text-anchor="middle" fill="#e8eaed" font-size="16" font-weight="700">ChatGPT</text>
  <text x="140" y="94" text-anchor="middle" fill="#9aa4b2" font-size="12">en la nube</text>

  <line x1="140" y1="112" x2="140" y2="160" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="152" y="142" fill="#9aa4b2" font-size="11">MCP munder-chatgpt-link</text>

  <!-- Victus -->
  <rect x="40" y="166" width="300" height="190" rx="12" fill="#1f2229" stroke="#5fb37a" stroke-width="2"/>
  <text x="60" y="196" fill="#5fb37a" font-size="12" font-weight="700">ESTA OFICINA · «self»</text>
  <text x="60" y="224" fill="#e8eaed" font-size="17" font-weight="700">michael-dannyisyco</text>
  <text x="60" y="248" fill="#9aa4b2" font-size="12">Linux · 14.8 GB · 12 CPUs</text>
  <text x="60" y="284" fill="#e8eaed" font-size="13">Michael (orquesta)</text>
  <text x="60" y="306" fill="#9aa4b2" font-size="12">Dwight · Jim · Oscar · Pam</text>
  <text x="60" y="336" fill="#9aa4b2" font-size="11">hive: tareas, inbox, board</text>

  <!-- Link -->
  <line x1="340" y1="250" x2="612" y2="250" stroke="#d6a84a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="380" y="196" width="196" height="34" rx="8" fill="#2a2415" stroke="#d6a84a"/>
  <text x="478" y="218" text-anchor="middle" fill="#f3d58a" font-size="14" font-weight="700">Munder Link</text>
  <text x="478" y="276" text-anchor="middle" fill="#9aa4b2" font-size="11">LAN o Tailscale</text>
  <text x="478" y="294" text-anchor="middle" fill="#9aa4b2" font-size="11">firmado Ed25519</text>
  <text x="478" y="312" text-anchor="middle" fill="#9aa4b2" font-size="11">cifrado X25519 + AES-256-GCM</text>
  <text x="478" y="330" text-anchor="middle" fill="#9aa4b2" font-size="11">emparejado con código de 6 dígitos</text>

  <!-- Xeon -->
  <rect x="620" y="166" width="300" height="190" rx="12" fill="#1f2229" stroke="#5b8def" stroke-width="2"/>
  <text x="640" y="196" fill="#5b8def" font-size="12" font-weight="700">OFICINA ENLAZADA · peer</text>
  <text x="640" y="224" fill="#e8eaed" font-size="17" font-weight="700">michael-danny</text>
  <text x="640" y="248" fill="#9aa4b2" font-size="12">Windows · 31.9 GB</text>
  <text x="640" y="284" fill="#e8eaed" font-size="13">Michael (orquesta)</text>
  <text x="640" y="306" fill="#9aa4b2" font-size="12">sus propios workers</text>
  <text x="640" y="336" fill="#9aa4b2" font-size="11">su hive nunca se comparte</text>

  <text x="590" y="70" fill="#e8eaed" font-size="13">Tu Michael delega a otro Michael.</text>
  <text x="590" y="92" fill="#9aa4b2" font-size="12">La tarea cae en SU inbox y él decide:</text>
  <text x="590" y="112" fill="#9aa4b2" font-size="12">nadie toca el hive ni las terminales ajenas.</text>
</svg>

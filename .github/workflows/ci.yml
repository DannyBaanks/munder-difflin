name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Lockfile lint (must be the output of CI's npm)
        # package-lock.json is only valid when generated by the npm CI runs
        # (10.x, see engines in package.json and .nvmrc): a lock regenerated
        # with another npm major silently drops/adds entries and breaks every
        # `npm ci` (2026-09-26: ws@8.21.3 missing in all 7 jobs). Regenerate
        # here and fail on any diff, instead of failing 3 minutes later.
        # The lock itself is only ever regenerated with:
        #   npx -y npm@10.8.2 install --package-lock-only --ignore-scripts
        run: |
          npx -y npm@10.8.2 install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links
      - name: Unit tests
        run: npm run test:focused

  build:
    # One build per OS we ship (Windows .exe, Linux .AppImage, mac .dmg): the
    # native node-pty/better-sqlite3 rebuild is where platforms diverge.
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not -latest: the same image release.yml builds the .exe on
        # (and the VS 2022 Build Tools install.ps1 installs). windows-latest ships
        # Visual Studio 18, which @electron/rebuild's node-gyp can't detect yet.
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    # "Download it and it works" on both Linux and Windows is only true if the
    # suite runs on both. fail-fast off: a Windows-only failure must not hide
    # whether Linux is green, and vice versa.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not -latest: the same image release.yml builds the .exe on
        # (and the VS 2022 Build Tools install.ps1 installs). windows-latest ships
        # Visual Studio 18, which @electron/rebuild's node-gyp can't detect yet.
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci runs postinstall (electron-rebuild), so node-pty is built for the
      # tests that spawn real PTYs; the build gives start.sh --check its bundle.
      - run: npm ci
      - run: npm run build
      # spec reporter: it ends with a "failing tests" summary, so every failure
      # is in the tail of the log (TAP scatters them across ~6000 lines).
      - name: Focused tests
        run: npm run test:focused -- --test-reporter=spec
      # proveedor.test.cjs is left out: it prompts for sudo and hangs headless.
      # harness-p0.test.cjs self-skips without HARNESS_P0_BIN (the codex/dsh
      # CLIs are not installed in CI); listing it keeps the file load-checked.
      - name: munder CLI tests
        run: node --test tools/munder/link.test.cjs tools/munder/remote.test.cjs tools/munder/avatar.test.cjs tools/munder/reviver.test.cjs tools/munder/gpt.test.cjs tools/munder/harness.test.cjs tools/munder/panel.test.cjs tools/munder/panel-remote.test.cjs tools/munder/harness-p0.test.cjs

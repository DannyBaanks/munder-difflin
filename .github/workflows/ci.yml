name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild; allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci runs postinstall (electron-rebuild), so node-pty is built for the
      # tests that spawn real PTYs; the build gives start.sh --check its bundle.
      - run: npm ci
      - run: npm run build
      - name: Focused tests
        run: npm run test:focused
      # proveedor.test.cjs is left out: it prompts for sudo and hangs headless.
      - name: munder CLI tests
        run: node --test tools/munder/link.test.cjs tools/munder/avatar.test.cjs

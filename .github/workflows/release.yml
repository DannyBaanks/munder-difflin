name: Release

# Build installers for every platform and publish them to a GitHub Release
# whenever a v* tag is pushed. Run manually (workflow_dispatch) to dry-build
# without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # unpdf@1.8 needs node >=22 (EBADENGINE on 20); blog/ios/android
          # already build on 22 (M4 roadmap 2026-09-26).
          node-version: 22
          cache: npm

      # node-gyp (used to rebuild native node-pty) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 and install setuptools so the distutils
      # shim is available across all runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Compile (electron-vite → out/)
        run: npm run build
        env:
          # Anonymous product analytics (TELEMETRY.md). The PostHog project key
          # is public/write-only, but only official release builds inject it —
          # forks without the secret compile with '' and analytics no-ops.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Apple signing credentials (only if configured)
        # app-builder-lib treats a SET-but-empty CSC_LINK as a certificate path:
        # it resolves '' against the checkout dir and dies with "not a file"
        # (run 36247008922, mac job). So the cert vars must be genuinely ABSENT
        # when unconfigured — not '' via `|| ''` — and are exported here only
        # when the P12 secret exists. When set, electron-builder receives the
        # exact same values as before; when unset, identity auto-discovery finds
        # no cert, warns, and produces an unsigned build.
        # NOTE: `secrets.*` is not a valid context inside step `if:` (parse
        # error, zero-job run), so the gate is matrix-only and the emptiness
        # check lives in bash with the secrets mapped through `env:` (safe for
        # arbitrary password characters, unlike `${{ }}` inside the script).
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$P12_B64" ]; then
            echo "CSC_LINK=$P12_B64" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$P12_PASS" >> "$GITHUB_ENV"
          fi

      - name: Package installers
        # GH_TOKEN lets electron-builder skip its own publish; we upload via the
        # release step below for full control over the asset set.
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization — MUST be macOS-only. CSC_LINK is the
          # Apple Developer ID .p12; if it leaks into the Windows/Linux runners,
          # electron-builder tries to sign those targets with the mac cert and the
          # build hard-fails ("cannot extract publisher name"). So it is exported
          # by the step above, only on mac and only when configured — never ''.
          #   APPLE_CERTIFICATE_P12       = base64 of the "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD  = that .p12's export password (REQUIRED if P12 set,
          #                                 else electron-builder imports with an empty
          #                                 password and fails "MAC verification failed")
          # All optional: with the secrets unset the CSC_* vars stay ABSENT and
          # every runner builds unsigned and stays green.
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # hash only the distributable artifacts, not blockmaps/yml
          files=$(ls *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null || true)
          [ -z "$files" ] && { echo "no artifacts to hash"; exit 0; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.os }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          # zip + latest*.yml + blockmaps feed electron-updater (auto-update):
          # latest-mac.yml points Squirrel.Mac at the zip; nsis/AppImage use
          # latest.yml/latest-linux.yml + blockmaps for differential download.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [build, mobile-ios, mobile-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + merge checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' -o -name '*.ipa' -o -name '*.apk' \) -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS-*.txt > release/SHA256SUMS.txt 2>/dev/null || true
          # Los móviles suben el binario suelto (sin su propio SHA256SUMS): se
          # hashea aquí para que todo lo descargable quede cubierto.
          (cd release && sha256sum MunderMobile-*.ipa MunderMobile-*.apk >> SHA256SUMS.txt)
          ls -la release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # RELEASE.md is the human-facing notes; GitHub shows it as the body.
          body_path: RELEASE.md
          # A tag carrying a TEST suffix (v0.4.4-rc.1, -beta.2, -alpha.1) publishes
          # as a PRE-RELEASE. The fork's own builds (v0.5.2-ISyCo.1) are real
          # releases: matching any "-" marked them pre-release too, and the
          # in-app check could never see them. This is load-bearing, not cosmetic: the in-app
          # updater polls /releases/latest, and GitHub excludes pre-releases from
          # that endpoint. So an rc gets a real, public, shareable download page
          # WITHOUT offering itself to every installed copy of the app — which is
          # exactly what you want for a build that needs testing on a platform the
          # authors cannot run. A clean `vX.Y.Z` tag is unaffected and still ships
          # as the latest release to everyone.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/*.ipa
            release/*.apk
            release/SHA256SUMS.txt

  mobile-ios:
    # El iPhone de la release: la misma .ipa sin firmar del CI de iOS
    # (XcodeGen + xcodebuild en macOS), instalada con iloader/SideStore/AltStore.
    name: Build iPhone IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios/MunderMobile
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme MunderMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/mm_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -5
        working-directory: ios/MunderMobile
      - name: Package the .ipa
        run: |
          APP=$(find /tmp/mm_dd -name "MunderMobile.app" -type d -path "*iphoneos*" | head -1)
          test -n "$APP" || { echo "::error::MunderMobile.app not found"; exit 1; }
          test -f "$APP/Media/Fonts/PressStart2P-Regular.ttf" || { echo "::error::font missing from the bundle"; exit 1; }
          test -f "$APP/Media/Cast/michael.png" || { echo "::error::cast portraits missing from the bundle"; exit 1; }
          rm -rf /tmp/signcheck.app && cp -R "$APP" /tmp/signcheck.app
          codesign --force --deep --sign - /tmp/signcheck.app
          codesign --verify --deep --strict --verbose=2 /tmp/signcheck.app
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          rm -f MunderMobile-unsigned.ipa
          zip -qr MunderMobile-unsigned.ipa Payload
          ls -la MunderMobile-unsigned.ipa
        working-directory: ios/MunderMobile
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MunderMobile-unsigned-ipa
          path: ios/MunderMobile/MunderMobile-unsigned.ipa
          retention-days: 30

  mobile-android:
    # El Android de la release: el mismo APK debug del CI (firmado con la
    # llave de debug, se instala directo, no caduca).
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --stacktrace
        working-directory: android/MunderMobile
      - name: Rename for the release page
        run: |
          APK=$(find android/MunderMobile/app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          cp "$APK" android/MunderMobile/MunderMobile-debug.apk
          ls -la android/MunderMobile/MunderMobile-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MunderMobile-debug-apk
          path: android/MunderMobile/MunderMobile-debug.apk
          retention-days: 30

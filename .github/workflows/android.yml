name: Android (Munder Mobile)

# El gemelo del .ipa: un APK debug firmado con la llave de debug, en un runner
# ubuntu gratuito. Mismo protocolo (munder-remote@1), misma lista PANEL_OFF,
# mismos retratos y demos que iOS: el móvil es solo un sustrato.
# Patrón espejo de .github/workflows/ios.yml.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/MunderMobile/Media/**'
      - 'ios/MunderMobile/Tests/vectors.json'
      - 'tools/munder/lib-remote.cjs'
      - 'tools/munder/lib-link.cjs'
      - 'tools/munder/lib-panel.cjs'
      - 'tools/munder/avatar-engine.cjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/MunderMobile/Media/**'
      - 'ios/MunderMobile/Tests/vectors.json'
      - 'tools/munder/lib-remote.cjs'
      - 'tools/munder/lib-link.cjs'
      - 'tools/munder/lib-panel.cjs'
      - 'tools/munder/avatar-engine.cjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Generated assets are current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # iOS primero: si la oficina se movió y nadie regeneró, se para aquí (barato).
      - run: node ios/MunderMobile/scripts/make-assets.cjs --check
      # Android después: retratos, demos, fuente, vectores y PANEL_OFF.
      - run: node android/MunderMobile/scripts/check-assets.cjs

  test:
    name: Unit tests (JVM)
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest --stacktrace
        working-directory: android/MunderMobile
      - name: Fail if no tests ran
        run: grep -rl "tests=" android/MunderMobile/app/build/test-results/testDebugUnitTest/*.xml | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munder-android-test-results
          path: android/MunderMobile/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  build:
    name: Build debug APK
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --stacktrace
        working-directory: android/MunderMobile
      - name: Check the APK carries its substrate
        run: |
          APK=$(find android/MunderMobile/app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          echo "APK: $APK"; ls -la "$APK"
          unzip -l "$APK" | grep -E "Media/Cast/michael.png|Media/Fonts/PressStart2P-Regular.ttf|Media/Demo/overview.json" || {
            echo "::error::cast portraits / font / demo missing from the APK"; exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MunderMobile-debug-apk
          path: android/MunderMobile/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  screenshots:
    # Las pantallas reales con la oficina de ejemplo incluida (sin red): lo que
    # el job `screenshots` de ios.yml fotografía en el simulador, pero en JVM
    # con Roborazzi. Los runners hospedados no tienen KVM (Linux) ni HVF
    # (macOS) y el emulador nunca termina el boot ahí — ver runs 36267182531
    # y 36268420580. Solo graba, como en iOS: las capturas son evidencia del
    # PR, no una compuerta pixel por pixel.
    name: Screenshots (Roborazzi, demo office)
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:recordRoborazziDebug --stacktrace
        working-directory: android/MunderMobile
      - name: Check the shots exist
        run: |
          ls -la android/MunderMobile/app/build/outputs/roborazzi/
          test "$(find android/MunderMobile/app/build/outputs/roborazzi -name '*.png' | wc -l)" -ge 13 || {
            echo "::error::faltan capturas (se esperan 13+)"; exit 1
          }
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: munder-android-screenshots
          path: android/MunderMobile/app/build/outputs/roborazzi/*.png
          retention-days: 30
